<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 360" width="800" height="360" role="img" aria-labelledby="diagram-title">
  <title id="diagram-title">Diagram of the NBA's structure: 30 teams split into two conferences, six divisions, a playoff round, and the NBA Finals</title>
  <style>
    .box { fill:#22252C; stroke:#FF6A1A; stroke-width:2; rx:8; }
    .lbl { fill:#F2F0E9; font-family: Arial, sans-serif; font-size:15px; text-anchor:middle; }
    .lbl-sm { fill:#F2F0E9; font-family: Arial, sans-serif; font-size:12px; text-anchor:middle; }
    .ln { stroke:#B5B3AA; stroke-width:1.5; fill:none; }
  </style>

  <line class="ln" x1="400" y1="60" x2="260" y2="90"/>
  <line class="ln" x1="400" y1="60" x2="540" y2="90"/>

  <line class="ln" x1="260" y1="130" x2="75"  y2="160"/>
  <line class="ln" x1="260" y1="130" x2="205" y2="160"/>
  <line class="ln" x1="260" y1="130" x2="335" y2="160"/>
  <line class="ln" x1="540" y1="130" x2="465" y2="160"/>
  <line class="ln" x1="540" y1="130" x2="595" y2="160"/>
  <line class="ln" x1="540" y1="130" x2="725" y2="160"/>

  <line class="ln" x1="75"  y1="196" x2="400" y2="230"/>
  <line class="ln" x1="205" y1="196" x2="400" y2="230"/>
  <line class="ln" x1="335" y1="196" x2="400" y2="230"/>
  <line class="ln" x1="465" y1="196" x2="400" y2="230"/>
  <line class="ln" x1="595" y1="196" x2="400" y2="230"/>
  <line class="ln" x1="725" y1="196" x2="400" y2="230"/>

  <line class="ln" x1="400" y1="270" x2="400" y2="300"/>

  <rect class="box" x="300" y="20" width="200" height="40"/>
  <text class="lbl" x="400" y="45">NBA — 30 Teams</text>

  <rect class="box" x="150" y="90" width="220" height="40"/>
  <text class="lbl" x="260" y="115">Eastern Conference</text>

  <rect class="box" x="430" y="90" width="220" height="40"/>
  <text class="lbl" x="540" y="115">Western Conference</text>

  <rect class="box" x="15"  y="160" width="120" height="36"/>
  <text class="lbl-sm" x="75" y="182">Atlantic</text>

  <rect class="box" x="145" y="160" width="120" height="36"/>
  <text class="lbl-sm" x="205" y="182">Central</text>

  <rect class="box" x="275" y="160" width="120" height="36"/>
  <text class="lbl-sm" x="335" y="182">Southeast</text>

  <rect class="box" x="405" y="160" width="120" height="36"/>
  <text class="lbl-sm" x="465" y="182">Northwest</text>

  <rect class="box" x="535" y="160" width="120" height="36"/>
  <text class="lbl-sm" x="595" y="182">Pacific</text>

  <rect class="box" x="665" y="160" width="120" height="36"/>
  <text class="lbl-sm" x="725" y="182">Southwest</text>

  <rect class="box" x="250" y="230" width="300" height="40"/>
  <text class="lbl" x="400" y="255">Playoffs — Top 6 + Play-In (7–10)</text>

  <rect class="box" x="320" y="300" width="160" height="40"/>
  <text class="lbl" x="400" y="325">NBA Finals</text>
</svg>
